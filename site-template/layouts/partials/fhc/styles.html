{{- /* FloridaHomeCosts data-component styles. Emitted once per page via Page.Store guard.
       Theme-neutral (works in PaperMod light + dark): grey-alpha borders/backgrounds, opacity for muted text. */ -}}
{{- if not (.Store.Get "fhc-css") -}}
{{- .Store.Set "fhc-css" true -}}
<style>
.fhc-data{border:1px solid rgba(128,128,128,.28);border-radius:8px;padding:1rem 1.15rem;margin:1.5rem 0;background:rgba(128,128,128,.05);font-size:.95rem;line-height:1.55}
.fhc-data h4{margin:.1rem 0 .6rem;font-size:1.05rem}
.fhc-data .fhc-applies{margin:.2rem 0;opacity:.85}
.fhc-data .fhc-fee{margin:.45rem 0;font-size:1.05rem}
.fhc-data ul.fhc-tiers{margin:.3rem 0 .3rem 1.15rem;padding:0}
.fhc-data .fhc-addons{margin:.35rem 0 .35rem 1.15rem;padding:0}
.fhc-data .fhc-notes{opacity:.75;margin:.55rem 0 .2rem}
.fhc-provenance{margin:.65rem 0 0;opacity:.72;border-top:1px solid rgba(128,128,128,.2);padding-top:.5rem}
.fhc-provenance a{word-break:break-all}
.fhc-caveat{margin-top:.7rem;padding:.55rem .8rem;border-left:3px solid rgba(128,128,128,.45);background:rgba(128,128,128,.04);font-size:.85rem;opacity:.92}
.fhc-caveat ul{margin:.3rem 0 .3rem 1.1rem}
.fhc-placeholder{opacity:.82;font-style:italic}
.fhc-premium-table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.9rem}
.fhc-premium-table th,.fhc-premium-table td{border:1px solid rgba(128,128,128,.25);padding:.35rem .55rem;text-align:right}
.fhc-premium-table th:first-child,.fhc-premium-table td:first-child{text-align:left}
.fhc-delta{font-weight:600}
.fhc-roi-grid{display:flex;flex-wrap:wrap;gap:1.1rem;margin:.6rem 0}
.fhc-roi-col{flex:1 1 220px}
.fhc-roi-col h5{margin:.1rem 0 .3rem;font-size:.95rem;opacity:.8;text-transform:uppercase;letter-spacing:.03em}
</style>
{{- end -}}
